<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>restoreyt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      background: #fff;
      color: #333;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header img {
      width: 32px;
      height: 32px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .toggle-row:last-child {
      border-bottom: none;
    }

    .toggle-label {
      font-size: 14px;
      color: #333;
    }

    .toggle-copy {
      display: grid;
      gap: 4px;
    }

    .toggle-note {
      color: #666;
      font-size: 11px;
    }

    .toggle-row.is-locked {
      opacity: 0.65;
    }

    .toggle-row.is-locked .slider {
      cursor: not-allowed;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ccc;
      border-radius: 24px;
      transition: background 0.2s;
    }

    .slider:before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    input:checked + .slider {
      background: #4CAF50;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .footer a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 13px;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../../icons/icon48.png" alt="restoreyt">
    <h1>restoreyt</h1>
  </div>

  <div id="toggles">
    <div class="toggle-row">
      <span class="toggle-label">Enable Extension</span>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Untranslate Titles</span>
      <label class="toggle">
        <input type="checkbox" id="untranslateTitle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Untranslate Thumbnails</span>
      <label class="toggle">
        <input type="checkbox" id="untranslateThumbnail" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Untranslate Descriptions</span>
      <label class="toggle">
        <input type="checkbox" id="untranslateDescription" checked>
        <span class="slider"></span>
      </label>
    </div>


    <div class="toggle-row is-locked">
      <div class="toggle-copy">
        <span class="toggle-label">Disable AI Audio</span>
        <span class="toggle-note" id="audioEvidenceGate">Evidence-gated: unavailable until runtime opt-in</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="untranslateAudio" checked disabled aria-describedby="audioEvidenceGate">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row is-locked">
      <div class="toggle-copy">
        <span class="toggle-label">Untranslate Channel Branding</span>
        <span class="toggle-note" id="channelBrandingEvidenceGate">Evidence-gated: unavailable until runtime opt-in</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="untranslateChannelBranding" checked disabled aria-describedby="channelBrandingEvidenceGate">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="openOptions">Advanced Settings</a>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <script src="../../build/popup.js"></script>
</body>
</html>
