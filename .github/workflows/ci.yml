name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run versioncheck
      - run: npm run lint
      - run: npm run typecheck --if-present
      - run: npm test
      - run: npm run test:spike
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run package --if-present

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-node-${{ matrix.node }}
          path: |
            test-results/
            playwright-results/
          retention-days: 7
